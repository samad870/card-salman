#cover.open .door.l{transform:translateX(-102%)}
#cover.open .door.r{transform:translateX(102%)}

@keyframes rot{to{transform:rotate(360deg)}}

 background:radial-gradient(ellipse at 50% 0,rgba(243,220,149,.28),transparent 60%),rgba(6,36,27,.6)}

.paper{max-height:0;opacity:0;overflow:hidden;transition:max-height 1.6s ease,opacity 1.2s ease;max-width:360px;width:100%}

.gn{font-weight:600}

 background:repeating-linear-gradient(45deg,transparent 0 9px,rgba(243,220,149,.85) 9px 10px),repeating-linear-gradient(-45deg,transparent 0 9px,rgba(243,220,149,.85) 9px 10px),#117a5a;
 box-shadow:inset 0 0 26px rgba(255,214,120,.9)}

.b{font:inherit;font-size:14px;border:1px solid var(--gold3);color:var(--gold3);background:transparent;padding:5px 12px;border-radius:20px;text-decoration:none;cursor:pointer}

.astro{width:min(300px,84%);margin:14px auto 0;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}

 border:9px solid transparent;border-image:repeating-linear-gradient(90deg,#b88a2c 0 6px,#f3dc95 6px 9px,#0f6a4f 9px 15px,#f3dc95 15px 18px) 9}
.rsvp label{display:block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold3);margin:14px 0 6px}

.bangle{flex:1;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0}

.notecard b{display:block;font-size:30px;margin-top:2px}
.contact{margin-top:24px}.contact p{margin:4px 0 8px}.contact .b{margin:0 3px}

/* ui */
#dots{position:fixed;top:50%;transform:translateY(-50%);right:max(6px,calc((100vw - 480px)/2 + 4px));z-index:20;display:flex;flex-direction:column;gap:10px}

#dots a{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold);display:block;opacity:.6;transition:.3s}

#music{position:fixed;top:12px;right:max(10px,calc((100vw - 480px)/2 + 10px));z-index:60;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:rgba(6,36,27,.85);color:var(--gold);font-size:17px;cursor:pointer;display:none}
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:5;max-width:480px;margin:0 auto}
.sparkles i{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 8px 2px rgba(255,220,120,.7);opacity:0;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.9;transform:translateY(-14px)}}
#gen{display:none;max-width:480px;margin:0 auto;padding:16px;background:#f5efdd;color:#222;font:14px system-ui,sans-serif}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* ---------- scenes ---------- */
const scenes = [];
scenes.push(["Cover", `
<section class="scene dark" id="s0"><div class="arch fade">
 <div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
 <p class="ital">${C.hall.intro}</p>
 <div class="cap" style="letter-spacing:.14em">${C.hall.host}</div>
 <p class="ital" style="font-size:15px;opacity:.85;margin:4px 0 10px">${C.hall.hostLine}</p>
 <div class="script g names">${C.groom}</div><div class="sub2">${C.hall.groomSub}</div>
 <div class="and">${C.hall.joiner}</div>
 <div class="script g names">${C.bride}</div><div class="sub2">${C.hall.brideSub}</div>
 <div class="dia"></div><div class="sub2" style="font-size:15px">${C.hall.address}</div></div>
 <div class="scrollhint">SCROLL ↓</div></section>`]);

scenes.push(["Letter", `
<section class="scene marble" id="s1">
 <div class="cap fade">A letter for</div>

 <div class="casket fade" id="casket">${casket}</div>
 <div class="hint" id="chint">Tap the casket to open your letter</div>
 <div class="paper" id="paper"><div class="sheet" id="sheet"></div></div>
</section>`]);

scenes.push(["Families", `
<section class="scene dark" id="s2">
 <div class="cap fade">With the blessings of</div>

 <div class="rail"></div>
 <div class="lanterns fade">
  <div class="lan">${lantern}<div class="cap">${C.families.groom.title}</div>${C.families.groom.lines.map(l=>`<p>${l}</p>`).join("")}</div>
  <div class="lan">${lantern}<div class="cap">${C.families.bride.title}</div>${C.families.bride.lines.map(l=>`<p>${l}</p>`).join("")}</div>
 </div>
</section>`]);

scenes.push(["Events", `
<section class="scene marble" id="s3">
 <div class="cap fade">Please join us for</div>
 <div class="script gd fade" style="font-size:clamp(44px,13vw,60px)">The Festivities</div>
 ${C.events.map((e,i)=>`
 <article class="ev ${i%2?'flip':''} fade" data-i="${i}">
  <div class="jh">${dome}<div class="win"><div class="in"><div class="shut sl"></div><div class="shut sr"></div></div></div><div class="sill"></div></div>
  <div class="evt"><h3 class="script">${e.title}</h3>${e.sub?`<div class="wd" style="color:var(--gold3)">${e.sub}</div>`:""}<div class="dia"></div>

   <div class="tm">${e.timeText}</div>
   <div class="more"><div class="vn">${e.venue}</div>
    <div class="evb"><a class="b" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.mapQuery||e.venue)}">Directions</a><button class="b" data-ics="${i}">Add to calendar</button></div></div>
   <div class="hint2">Open the window</div></div>
 </article>`).join("")}
</section>`]);

scenes.push(["Countdown", `
<section class="scene dark" id="s4">

$("#app").innerHTML = scenes.map(s => s[1]).join("");

/* dots */
$("#dots").innerHTML = scenes.map((s,i)=>`<a href="#s${i}" title="${s[0]}"></a>`).join("");

/* guest name + letter */
$("#gname").textContent = guest || "our dear guest";
(function(){
  const sheet = $("#sheet");
  C.letter.forEach(t => {
    const p = document.createElement("p");
    rep(t).split("{guest}").forEach((part, i, arr) => {
      p.appendChild(document.createTextNode(part));
      if (i < arr.length - 1) { const s = document.createElement("span"); s.className = "gn"; s.textContent = guest || "dear guest"; p.appendChild(s); }
    });
    sheet.appendChild(p);
  });
})();
$("#casket").onclick = () => { $("#casket").classList.add("open"); $("#paper").classList.add("show"); $("#chint").style.display = "none";
  setTimeout(() => $("#paper").scrollIntoView({behavior:"smooth", block:"center"}), 700); };

/* events */
document.addEventListener("click", e => {
  const ev = e.target.closest(".ev");
  if (ev && !e.target.closest(".b")) ev.classList.toggle("open");
  const ib = e.target.closest("[data-ics]");
  if (ib) icsDownload(C.events[+ib.dataset.ics]);
});
function icsDownload(ev){
  const st = new Date(ev.date), en = new Date(st.getTime() + 3*3600e3);
  const z = d => d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const txt = ["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT","DTSTART:"+z(st),"DTEND:"+z(en),
    `SUMMARY:${ev.title} - ${C.groom} & ${C.bride}`,`LOCATION:${ev.venue}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], {type:"text/calendar"}));
  a.download = ev.id + ".ics"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* countdown */
const target = C.events.find(e => e.id === C.countdownTo) || C.events[0];
$("#cdhint").textContent = `Counting down to the ${target.title}`;
function tick(){
  const diff = new Date(target.date) - Date.now(), box = $("#cd");
  if (diff <= 0) { box.innerHTML = `<div style="width:auto;padding:10px 18px"><b style="font-size:18px">Alhamdulillah — the celebrations have begun</b></div>`; return; }
  const d = Math.floor(diff/864e5), h = Math.floor(diff%864e5/36e5), m = Math.floor(diff%36e5/6e4), s = Math.floor(diff%6e4/1e3);
  box.innerHTML = [[d,"DAYS"],[h,"HOURS"],[m,"MIN"],[s,"SEC"]].map(([n,l]) => `<div><b>${n}</b><span>${l}</span></div>`).join("");
}
tick(); setInterval(tick, 1000);

/* cover */
const aud = $("#aud");
if (C.musicUrl) { aud.src = C.musicUrl; $("#music").style.display = "block"; }
$("#music").onclick = () => { if (aud.paused) { aud.play().catch(()=>{}); $("#music").style.opacity = 1; } else { aud.pause(); $("#music").style.opacity = .5; } };
function openCover(){
  $("#cover").classList.add("open");
  if (C.musicUrl) { aud.play().catch(()=>{}); }
  setTimeout(() => { $("#cover").style.display = "none"; document.body.classList.remove("locked"); window.scrollTo(0,0); }, 1900);
}
$("#seal").onclick = openCover;
$("#cover").addEventListener("click", e => { if (e.target.classList.contains("door")) openCover(); });

/* reveal + dots */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); }), {threshold:.15});
document.querySelectorAll(".fade").forEach(el => io.observe(el));
const dots = [...document.querySelectorAll("#dots a")];
const io2 = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const i = +e.target.id.slice(1); dots.forEach((d,k) => d.classList.toggle("on", k === i)); } }), {threshold:.5});
document.querySelectorAll(".scene").forEach(s => io2.observe(s));

/* sparkles */
$("#sp").innerHTML = Array.from({length:26}, () => `<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*4).toFixed(2)}s;animation-duration:${(3+Math.random()*3).toFixed(1)}s"></i>`).join("");

/* guest link generator: ?gen=1 */
if (qs.get("gen")) {
  $("#gen").style.display = "block"; $("#cover").style.display = "none"; document.body.classList.remove("locked");
  $("#mk").onclick = () => {
    const base = location.origin + location.pathname, out = $("#out"); out.innerHTML = "";
    $("#names").value.split("\n").map(s => s.trim()).filter(Boolean).forEach(n => {
      const url = `${base}?guest=${encodeURIComponent(n)}`;
      const wa = `https://wa.me/?text=${encodeURIComponent(`Assalamu Alaikum ${n}, aapko hamari shaadi mein invite karte hain 🤍\n${url}`)}`;
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<span></span><span><a target="_blank" rel="noopener">WhatsApp</a> · <a href="#" class="cp">Copy link</a></span>`;
      r.firstChild.textContent = n; r.querySelector("a").href = wa;
      r.querySelector(".cp").onclick = e => { e.preventDefault(); navigator.clipboard.writeText(url); e.target.textContent = "Copied"; };
      out.appendChild(r);
    });
  };
}
</script>
</body>
